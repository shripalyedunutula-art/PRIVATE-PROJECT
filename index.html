<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Pothole Detection Simulation</title>
    <!-- A-Frame Library for VR/AR Rendering -->
    <script src="https://aframe.io"></script>
</head>
<body>

    <!-- The VR Scene Context -->
    <a-scene xr-mode-ui="enabled: true">
        
        <!-- Sky / Environment Atmosphere -->
        <a-sky color="#87CEEB"></a-sky>
        <a-ambient-light color="#bbb"></a-ambient-light>
        <a-directional-light color="#fff" intensity="0.6" position="-1 2 4"></a-directional-light>

        <!-- Infinite Looking Endless Road Grid -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="2000" color="#333333"></a-plane>
        <!-- Center Road Lines -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="0.2" height="2000" color="#FFFF00" material="repeat: 1 100; shader: flat"></a-plane>

        <!-- THE POTHOLE: Placed 100 meters away along the Z-axis (-100) -->
        <a-cylinder id="pothole" position="0 0.02 -100" radius="1.5" height="0.05" color="#111111"></a-cylinder>

        <!-- THE VIRTUAL CAR & CAMERA (The player sits inside this rig) -->
        
            
            <!-- 3D Conceptual Car Body (Simple shapes representing the vehicle) -->
            <a-box position="0 0.6 0" width="2" height="0.8" depth="4" color="#ff0000"></a-box>
            <a-box position="0 1.2 -0.5" width="1.8" height="0.6" depth="2" color="#111111" material="opacity: 0.8; transparent: true"></a-box>
            
            <!-- VR Camera Hooked Inside the Car -->
            
                
                <!-- HUD / Virtual Action Reality Alert UI -->
                
                
                
            
        

    </a-scene>

    <!-- Simulation & Detection Logic -->
    <script>
        const car = document.getElementById('car-rig');
        const pothole = document.getElementById('pothole');
        const hud = document.getElementById('hud');

        const speed = 0.3; // Speed of the moving car
        const detectionThreshold = 100; // Distance in meters to trigger detection

        function updateSimulation() {
            // 1. Move the car forward along the negative Z-axis
            let currentPos = car.getAttribute('position');
            currentPos.z -= speed;
            car.setAttribute('position', currentPos);

            // 2. Fetch the target pothole's position
            let potholePos = pothole.getAttribute('position');

            // 3. Calculate the distance between the car and the pothole
            let distance = Math.abs(currentPos.z - potholePos.z);

            // 4. Action Reality Detection Logic
            if (currentPos.z <= potholePos.z) {
                // Car has passed or hit the pothole
                hud.setAttribute('material', 'color', '#333333');
                hud.setAttribute('text', 'value: Pothole Passed; color: #FFFFFF');
            } else if (distance <= detectionThreshold) {
                // Pothole detected within 100 meters!
                hud.setAttribute('material', 'color', '#CC0000'); // Turn HUD Red
                hud.setAttribute('text', `value: WARNING: POTHOLE\n${Math.round(distance)}m Ahead!; color: #FFFFFF`);
            } else {
                // Scanning phase
                hud.setAttribute('material', 'color', '#000000');
                hud.setAttribute('text', `value: Scanning Road...\nPothole: ${Math.round(distance)}m away; color: #00FF00`);
            }

            // Loop the animation framework frame by frame
            requestAnimationFrame(updateSimulation);
        }

        // Start the simulation when the page loads
        window.onload = updateSimulation;
    </script>
</body>
</html>
